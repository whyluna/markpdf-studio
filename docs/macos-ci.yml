# MarkPDF Studio — macOS CI 模板
#
# 仓库已存在 .github/workflows/macos.yml，但当前在 GitHub 仓库设置中停用。
# 本文件仅作参考模板；重新启用 CI 时应与正式 workflow 同步，README badge
# 只能在真实持续运行且结果可信时恢复。
#
# 流程：检出 → Node 环境 → 构建 Web 编辑器内核（dist/editor.js）
#       → XcodeGen 生成工程 → xcodebuild 编译 → 单元测试。

name: macOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      # 文档/设计稿改动不触发构建，节省 Actions 分钟数
      - "docs/**"
      - "prototype/**"
      - "README.md"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MarkPDF/Resources/Web/package-lock.json

      - name: Build and test Web editor core
        run: |
          cd MarkPDF/Resources/Web
          npm ci
          npm test
          npm run build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: >-
          xcodebuild build
          -project MarkPDF.xcodeproj
          -scheme MarkPDF
          -destination "platform=macOS"
          CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: >-
          xcodebuild test
          -project MarkPDF.xcodeproj
          -scheme MarkPDF
          -destination "platform=macOS"
          CODE_SIGNING_ALLOWED=NO
