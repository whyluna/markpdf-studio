<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarkPDF 编辑器内核</title>
<style>
:root{
  --win-bg:#ffffff; --text:#1d1d1f; --text2:#6e6e73; --text3:#aeaeb2;
  --border:#e2e2e6; --sel:rgba(10,132,255,.15); --accent:#0a84ff; --code-bg:#f6f8fa;
  --tok-k:#af3ad4; --tok-s:#c9352b; --tok-c:#8e8e93; --tok-f:#0a84ff; --tok-n:#b05c00;
  --editor-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --hl:rgba(255,212,59,.4);
}
[data-theme="dark"]{
  --win-bg:#1e1e21; --text:#f5f5f7; --text2:#a1a1a6; --text3:#6c6c70;
  --border:#3c3c41; --sel:rgba(10,132,255,.35); --accent:#0a84ff; --code-bg:#2a2a30;
  --tok-k:#e08cff; --tok-s:#ff9a8a; --tok-c:#8e8e93; --tok-f:#6ab8ff; --tok-n:#ffbe5c;
  --hl:rgba(255,197,23,.27);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--win-bg);color:var(--text);font-family:var(--editor-font)}

/* ---------- 开发调试工具栏（App 内通过 ?app=1 隐藏） ---------- */
#devbar{
  height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;
  border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);
  background:var(--code-bg);
}
#devbar .label{font-weight:600;color:var(--text);margin-right:4px}
#devbar button{
  border:1px solid var(--border);background:var(--win-bg);color:var(--text);
  border-radius:6px;padding:4px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
}
#devbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#devbar .sep{width:1px;height:18px;background:var(--border);margin:0 4px}
#devbar .hint{margin-left:auto;font-size:11.5px;color:var(--text3)}
body.app #devbar{display:none}
body{display:flex;flex-direction:column}
#editor{flex:1;overflow:hidden}

/* ---------- 所见即所得装饰样式 ---------- */
/* CM6 行元素禁止垂直 margin（不计入 offsetHeight，会造成坐标映射累积漂移），垂直间距一律用 padding */
.cm-h1{font-size:27px;font-weight:700;border-bottom:1px solid var(--border);padding:4px 0 8px}
.cm-h2{font-size:20px;font-weight:650;padding:18px 0 2px}
.cm-h3{font-size:17px;font-weight:600;padding:12px 0 2px}
.cm-h4,.cm-h5,.cm-h6{font-size:15.5px;font-weight:600;padding:8px 0 2px}
.cm-strong{font-weight:650}
.cm-em{font-style:italic}
.cm-strike{text-decoration:line-through;color:var(--text2)}
.cm-inline-code{
  font-family:var(--mono);font-size:.86em;background:var(--code-bg);
  border-radius:5px;padding:1px 5px;color:#c7254e;
}
[data-theme="dark"] .cm-inline-code{color:#ff7a9e}
.cm-link{color:var(--accent);border-bottom:1px dashed var(--accent)}
/* 按住 ⌘：链接变为可点击形态 */
.cm-mod-down .cm-link{cursor:pointer;text-decoration:underline;border-bottom-color:transparent}
.cm-image{color:var(--accent)}
.cm-quote-line{
  border-left:3px solid var(--accent);background:var(--code-bg);
  color:var(--text2);padding-left:14px;
}
/* 代码块：四周描边 + 浅灰底（对齐表格边框风格）。
   底色必须半透明：不透明底色会盖住 drawSelection 选层高亮（框内看不到选区） */
.cm-codeblock-line{
  font-family:var(--mono);font-size:14px;line-height:1.6;background:rgba(175,184,193,.16);
  border-left:1px solid var(--border);border-right:1px solid var(--border);
  padding-left:16px;padding-right:16px;
}
[data-theme="dark"] .cm-codeblock-line{background:rgba(110,118,129,.18)}
/* 头部语言栏：badge 固定高度决定栏高（消除真机 CJK 字体行盒把栏撑高的不确定性）；
   左右 15px 使内容对齐代码 16px（边框 box-sizing 占 1px） */
.cm-codeblock-first{
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  border-radius:6px 6px 0 0;padding:0 15px;
}
/* 末尾 fence 行：渲染态被 .cm-fence-end widget 收起为底部留白；编辑态 ``` 源码行正常显示。
   零行高只对渲染态生效——否则编辑态 ``` 被压成 0 高、与上一行重叠（:has 区分两态） */
.cm-codeblock-last{
  border-bottom:1px solid var(--border);border-radius:0 0 6px 6px;
}
.cm-codeblock-last:has(.cm-fence-end){padding-top:14px;padding-bottom:0;line-height:0}
.cm-codeblock-last:not(:has(.cm-fence-end)){padding-bottom:8px}
/* 语言栏：固定 28px 高，左 python▾ 语言选择、右复制图标按钮，垂直居中、两端对齐 */
.cm-fence-badge{
  display:inline-flex;align-items:center;justify-content:space-between;width:100%;height:28px;
}
.cm-fence-lang-wrap{position:relative;display:inline-flex;align-items:center}
.cm-fence-label{
  font-family:var(--editor-font);font-size:13.5px;font-weight:500;line-height:1;
  color:var(--text2);background:transparent;border-radius:5px;padding:3px 8px;cursor:pointer;
}
.cm-fence-lang-wrap:hover .cm-fence-label{color:var(--text);background:var(--sel)}
/* 隐形原生 select 覆盖 label；font-size 决定弹出 option 菜单的字号（此前默认过小） */
.cm-fence-lang{
  position:absolute;inset:0;opacity:0;cursor:pointer;
  appearance:none;-webkit-appearance:none;border:none;font-size:14px;
}
/* 复制：图标按钮（无文字），低调灰、hover 浅底、已复制态显强调色对勾 */
.cm-fence-copy{
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--text2);background:transparent;border:none;border-radius:5px;
  padding:4px;cursor:pointer;
}
.cm-fence-copy:hover{color:var(--text);background:var(--sel)}
.cm-fence-copy.copied{color:var(--accent)}
.cm-fence-copy svg{display:block}
.cm-fence-end{display:inline-block;height:0;vertical-align:top}
/* 代码首行与语言栏的间距 */
.cm-codeblock-first + .cm-codeblock-line{padding-top:10px}
.cm-task-checkbox{
  width:15px;height:15px;margin-right:7px;accent-color:var(--accent);
  vertical-align:-2px;cursor:pointer;
}
.cm-hr{display:block;width:100%;border-top:1px solid var(--border);height:0;padding-top:4px}
/* 查找面板（⌘F）：美化为 macOS 风格，向 PDF 查找栏观感对齐（FR-3.4 一致性）；命中高亮保持 */
.cm-panels{background:var(--code-bg);color:var(--text);border-bottom:1px solid var(--border)}
.cm-panels .cm-search{padding:8px 36px 8px 12px;position:relative}
.cm-panels .cm-textfield{
  font-family:var(--editor-font);font-size:12.5px;background:var(--win-bg);color:var(--text);
  border:1px solid var(--border);border-radius:6px;padding:4px 9px;outline:none;
  margin:2px 6px 2px 0;min-width:180px;
}
.cm-panels .cm-textfield:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--sel)}
.cm-panels .cm-button{
  font-family:var(--editor-font);font-size:12px;background:var(--win-bg);background-image:none;
  color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 10px;
  margin:2px 4px 2px 0;cursor:pointer;
}
.cm-panels .cm-button:hover{background:var(--code-bg);border-color:var(--text3)}
.cm-panels .cm-button:active{background:var(--sel)}
.cm-panels .cm-search label{font-size:12px;color:var(--text2);margin:0 8px 0 0}
.cm-panels .cm-search label input[type=checkbox]{accent-color:var(--accent);vertical-align:-1px;margin-right:3px}
.cm-panels .cm-search [name=close]{
  position:absolute;top:6px;right:10px;border:none;background:transparent;color:var(--text2);
  font-size:16px;line-height:1;padding:2px 6px;border-radius:6px;cursor:pointer;margin:0;
}
.cm-panels .cm-search [name=close]:hover{background:var(--sel);color:var(--text)}
.cm-searchMatch{background:rgba(255,212,59,.45);border-radius:2px}
.cm-searchMatch-selected{background:rgba(255,150,50,.55)}
/* 文本级选区高亮（替代 drawSelection 整行色块）：只覆盖实际文字 */
.cm-sel-text{background:var(--sel)}
/* 渲染图片（FR-2.3）：不留内边距，紧凑排布 */
.cm-rendered-image{max-width:100%;border-radius:6px;display:block;padding:0}
.cm-image-broken{color:var(--text3);font-size:13px;padding:0}
.cm-table-line{font-family:var(--mono);font-size:13.5px}
/* 渲染态表格（对齐设计稿 .mdwrap table；Widget 根元素用 padding 代替垂直 margin） */
.cm-table-widget{padding:8px 0;overflow-x:auto;cursor:default}
.cm-table-widget table{width:100%;border-collapse:collapse;font-size:14px}
.cm-table-widget th,.cm-table-widget td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.cm-table-widget th{background:var(--code-bg);font-weight:600}
.cm-table-widget tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--code-bg) 45%,transparent)}
/* KaTeX 公式（FR-2.4）。widget 根元素用 padding 代替垂直 margin（margin 不计入 offsetHeight） */
.cm-math-display{padding:8px 0;overflow-x:auto}
.cm-math-display .katex-display{margin:0}
/* 高亮 ==text==：半透明黄底随明暗主题（--hl），文字保持主题色 */
.cm-highlight{background:var(--hl);border-radius:3px;padding:0 1px}
/* 脚注：引用上标与定义行（小号、次要色） */
.cm-footnote-ref{color:var(--accent);font-size:.78em;padding:0 1px;cursor:default}
.cm-footnote-def{font-size:13px;color:var(--text2)}
/* 专注模式（FR-2.10）：非当前行压暗，当前行正常；过渡柔和 */
.cm-focus-mode .cm-line{opacity:.35;transition:opacity .18s ease}
.cm-focus-mode .cm-line.cm-focus-line{opacity:1}
</style>
<!-- KaTeX 样式（esbuild 由 src/main.js 的 CSS import 自动拆出） -->
<link rel="stylesheet" href="dist/editor.css">
</head>
<body>
<div id="devbar">
  <span class="label">内核调试台</span>
  <button data-mode="wysiwyg" class="on">所见即所得</button>
  <button data-mode="source">源码</button>
  <button data-mode="reading">阅读</button>
  <div class="sep"></div>
  <button id="themeBtn">切换明暗</button>
  <div class="sep"></div>
  <button id="getBtn">getContent → console</button>
  <span class="hint">此工具栏仅开发环境可见（?app=1 隐藏）</span>
</div>
<div id="editor"></div>
<script src="dist/editor.js"></script>
<script>
// 开发调试台：通过 bridge 协议驱动内核，与 native 调用路径完全一致
(function () {
  const isApp = new URLSearchParams(location.search).get("app") === "1";
  if (isApp) document.body.classList.add("app");

  const modeBtns = [...document.querySelectorAll("#devbar [data-mode]")];
  modeBtns.forEach((b) =>
    b.addEventListener("click", () => {
      modeBtns.forEach((x) => x.classList.toggle("on", x === b));
      window.bridge.receive({ type: "editor.setMode", payload: { mode: b.dataset.mode } });
    })
  );

  document.getElementById("themeBtn").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    window.bridge.receive({ type: "editor.setTheme", payload: { theme: next } });
  });

  document.getElementById("getBtn").addEventListener("click", () => {
    window.bridge.request
      ? window.bridge
          .request("editor.getContent", {})
          .then((p) => console.log("[getContent mock-ack]", p))
      : null;
    // 直接走 receive + id，观察 respond 回包
    window.bridge.receive({ id: "dev-1", type: "editor.getContent", payload: {} });
  });
})();
</script>
</body>
</html>
