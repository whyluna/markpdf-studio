name: MarkPDF
options:
  bundleIdPrefix: com.whyluna
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  MarkPDF:
    type: application
    platform: macOS
    sources:
      - path: MarkPDF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whyluna.markpdf
        CODE_SIGN_ENTITLEMENTS: MarkPDF/MarkPDF.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  MarkPDFTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MarkPDFTests
    dependencies:
      - target: MarkPDF
  MarkPDFUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MarkPDFUITests
    dependencies:
      - target: MarkPDF
