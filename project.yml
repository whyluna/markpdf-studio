name: MarkPDF
options:
  bundleIdPrefix: com.whyluna
  # 本地化：源语言中文（catalog 以中文字面量为 key，补英文译文）
  developmentLanguage: zh-Hans
  deploymentTarget:
    # FR-AI 决策：系统翻译 TranslationSession 需 macOS 15（见需求文档 v1.1 模块 8）
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    # 编译时把 SwiftUI 字面量与 String(localized:) 自动收编进 Localizable.xcstrings
    SWIFT_EMIT_LOC_STRINGS: YES
# FR-AI 决策：AI 网络层自写薄 SSE 客户端（OpenAI 兼容 + Anthropic 各 ~150 行），
# 不引入 SwiftOpenAI/SwiftAnthropic 第三方包，保持规范 §1 原生零依赖
packages:
  # AI 助手公式排版：纯 Swift 原生 LaTeX（CoreText，同步布局——替换
  # 一个公式一个 WKWebView 的方案，滚动抖动/异步高度/选区割裂从根上消失）。
  # 本地 vendor（GitHub 直连不稳时离线可构建；升级 = 重新 clone 覆盖此目录）
  SwiftMath:
    path: vendor/SwiftMath
targets:
  MarkPDF:
    type: application
    platform: macOS
    dependencies:
      - package: SwiftMath
    sources:
      # Swift 源码与常规资源（排除 Resources，Web 内核单独处理）
      - path: MarkPDF
        excludes:
          - "Resources/**"
      # Web 内核页面：index.html 平铺进 bundle 根目录
      - path: MarkPDF/Resources/Web/index.html
      # 内核构建产物：以文件夹引用保留 dist/ 结构（index.html 按此相对路径加载）
      - path: MarkPDF/Resources/Web/dist
        buildPhase: resources
        type: folder
    preBuildScripts:
      # 内核产物缺失时自动构建（npm 需位于 /opt/homebrew/bin 或 /usr/local/bin；兼容 nvm）
      - name: Build Web Editor Core
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          # nvm 安装的 Node 不在默认 PATH，尝试加载
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh" >/dev/null 2>&1 || true
          fi
          WEB_DIR="${SRCROOT}/MarkPDF/Resources/Web"
          if [ ! -f "${WEB_DIR}/dist/editor.js" ]; then
            echo "Web 内核未构建，执行 npm ci && npm run build"
            cd "${WEB_DIR}" && npm ci && npm run build
          fi
        # 声明输出：内核已构建时 Xcode 跳过此脚本（消除 every build 警告）
        outputFiles:
          - "$(SRCROOT)/MarkPDF/Resources/Web/dist/editor.js"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whyluna.markpdf
        CODE_SIGN_ENTITLEMENTS: MarkPDF/MarkPDF.entitlements
        # 手动 Info.plist（声明 PDF/Markdown 文档类型，Finder 打开入口的前提）
        INFOPLIST_FILE: MarkPDF/Info.plist
  MarkPDFTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MarkPDFTests
    settings:
      base:
        # App target 用手动 Info.plist；测试 bundle 仍自动生成
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MarkPDF
